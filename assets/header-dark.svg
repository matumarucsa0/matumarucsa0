<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Terminal: Matus Maruscak, Python backend developer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="c1"><rect x="36" y="88" width="840" height="22"><animate attributeName="width" from="0" to="840" dur="0.65s" begin="0.15s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="36" y="118" width="840" height="22"><animate attributeName="width" from="0" to="840" dur="0.65s" begin="0.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="36" y="160" width="840" height="22"><animate attributeName="width" from="0" to="840" dur="0.65s" begin="1.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="36" y="190" width="840" height="22"><animate attributeName="width" from="0" to="840" dur="0.65s" begin="2.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="36" y="220" width="840" height="22"><animate attributeName="width" from="0" to="840" dur="0.65s" begin="3.0s" fill="freeze"/></rect></clipPath>
    <style>
      .mono{font-family:ui-monospace,"SFMono-Regular","JetBrains Mono","Menlo","Consolas",monospace}
      .fg{fill:#e6edf3}.dim{fill:#8b949e}.acc{fill:#58a6ff}.grn{fill:#3fb950}.ylw{fill:#d29922}
      .cur{animation:blink 1.1s steps(1) 3.7s infinite both;opacity:0}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .fade{animation:fade .5s ease-out both}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){
        .cur,.fade{animation:none;opacity:1}
      }
    </style>
