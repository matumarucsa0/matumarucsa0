  <g clip-path="url(#c4)"><text class="mono fg" x="36" y="206" font-size="15"><tspan class="acc">→</tspan> Informatics @ MFF UK, Prague</text></g>
  <g clip-path="url(#c5)"><text class="mono fg" x="36" y="236" font-size="15"><tspan class="acc">→</tspan> Pipelines, Postgres, and services that don't wake you at 3am</text></g>
