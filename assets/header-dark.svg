  <rect x="1" y="1" width="898" height="278" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="278" rx="12" fill="url(#glow)"/>
  <path d="M1 13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v31H1z" fill="#161b22"/>
