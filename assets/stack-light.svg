<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="900" height="215" role="img" aria-label="Pipeline: sources to Airflow to PostgreSQL to services. Stack: Python, Airflow, PostgreSQL, SQLAlchemy, Docker, GitLab CI/CD, AWS, Flask">
  <defs>
    <style>
      .mono{font-family:ui-monospace,"SFMono-Regular","JetBrains Mono","Menlo","Consolas",monospace}
      .fg{fill:#1f2328}.dim{fill:#59636e}
      .node{fill:#f6f8fa;stroke:#d0d7de}
      .flow{stroke:#0969da;stroke-width:2;stroke-dasharray:5 7;stroke-linecap:round;animation:flow 1.4s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-24}}
      .chip{fill:#f6f8fa;stroke:#d0d7de;animation:pop .45s ease-out both}
      @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
      .p1{animation-delay:.05s}.p2{animation-delay:.12s}.p3{animation-delay:.19s}.p4{animation-delay:.26s}
      .p5{animation-delay:.33s}.p6{animation-delay:.40s}.p7{animation-delay:.47s}.p8{animation-delay:.54s}
      @media (prefers-reduced-motion:reduce){.flow,.chip{animation:none;opacity:1}}
    </style>
  </defs>

  <text class="mono dim" x="30" y="24" font-size="12.5">// what I actually work on</text>

  <g>
    <rect class="node" x="30"  y="44" width="170" height="58" rx="8"/>
    <text class="mono fg"  x="115" y="70" font-size="14" text-anchor="middle">sources</text>
    <text class="mono dim" x="115" y="88" font-size="11.5" text-anchor="middle">meters · APIs · files</text>

    <rect class="node" x="250" y="44" width="170" height="58" rx="8"/>
    <text class="mono fg"  x="335" y="70" font-size="14" text-anchor="middle">Airflow</text>
    <text class="mono dim" x="335" y="88" font-size="11.5" text-anchor="middle">scheduled DAGs</text>

    <rect class="node" x="470" y="44" width="170" height="58" rx="8"/>
    <text class="mono fg"  x="555" y="70" font-size="14" text-anchor="middle">PostgreSQL</text>
    <text class="mono dim" x="555" y="88" font-size="11.5" text-anchor="middle">TimescaleDB · SQLAlchemy</text>

    <rect class="node" x="690" y="44" width="170" height="58" rx="8"/>
    <text class="mono fg"  x="775" y="70" font-size="14" text-anchor="middle">services</text>
    <text class="mono dim" x="775" y="88" font-size="11.5" text-anchor="middle">Python · Flask · Docker</text>

    <line class="flow" x1="204" y1="73" x2="246" y2="73"/>
    <line class="flow" x1="424" y1="73" x2="466" y2="73"/>
    <line class="flow" x1="644" y1="73" x2="686" y2="73"/>
  </g>

  <g>
    <rect class="chip p1" x="105" y="150" width="69"  height="28" rx="14"/><text class="mono fg" x="139.5" y="169" font-size="12.5" text-anchor="middle">Python</text>
    <rect class="chip p2" x="182" y="150" width="77"  height="28" rx="14"/><text class="mono fg" x="220.5" y="169" font-size="12.5" text-anchor="middle">Airflow</text>
    <rect class="chip p3" x="267" y="150" width="99"  height="28" rx="14"/><text class="mono fg" x="316.5" y="169" font-size="12.5" text-anchor="middle">PostgreSQL</text>
    <rect class="chip p4" x="374" y="150" width="99"  height="28" rx="14"/><text class="mono fg" x="423.5" y="169" font-size="12.5" text-anchor="middle">SQLAlchemy</text>
    <rect class="chip p5" x="481" y="150" width="69"  height="28" rx="14"/><text class="mono fg" x="515.5" y="169" font-size="12.5" text-anchor="middle">Docker</text>
    <rect class="chip p6" x="558" y="150" width="114" height="28" rx="14"/><text class="mono fg" x="615"   y="169" font-size="12.5" text-anchor="middle">GitLab CI/CD</text>
    <rect class="chip p7" x="680" y="150" width="47"  height="28" rx="14"/><text class="mono fg" x="703.5" y="169" font-size="12.5" text-anchor="middle">AWS</text>
    <rect class="chip p8" x="735" y="150" width="61"  height="28" rx="14"/><text class="mono fg" x="765.5" y="169" font-size="12.5" text-anchor="middle">Flask</text>
  </g>
</svg>
